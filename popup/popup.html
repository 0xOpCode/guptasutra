<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guptasutra</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <span class="icon">🔒</span>
        <h1>Guptasutra</h1>
      </div>
      <span class="version">v1.0</span>
    </header>

    <div class="form-group">
      <label for="passphrase">Shared Secret Passphrase</label>
      <div class="input-row">
        <input type="password" id="passphrase" placeholder="Enter matching passphrase...">
        <button id="toggle-pw" type="button" class="btn-icon">👁️</button>
      </div>
      <p class="hint">Both you and your friend must enter this exact passphrase.</p>
    </div>

    <div class="form-group">
      <label for="cover-select">Decoy Cover Message</label>
      <select id="cover-select">
        <option value="random_emoji">🎲 Random Neutral Emojis (👍, 🤝, ☕, etc.)</option>
        <option value="Sounds good, let us meet tomorrow.">"Sounds good, let us meet tomorrow."</option>
        <option value="Yeah totally agree with that.">"Yeah totally agree with that."</option>
        <option value="Will check this and update here.">"Will check this and update here."</option>
        <option value="custom">Custom Cover Text...</option>
      </select>
      <input type="text" id="custom-cover" class="hidden" placeholder="Enter custom decoy message...">
    </div>

    <div class="toggle-row">
      <span>Auto-Encrypt WhatsApp Messages</span>
      <label class="switch">
        <input type="checkbox" id="enabled-toggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <button id="save-btn" class="btn-primary">Save Configuration</button>
    <div id="status-msg" class="status-msg hidden">Configuration saved.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
